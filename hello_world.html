<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello, World! ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #090a10;
      --accent-1: #8a2be2;
      --accent-2: #4f46e5;
      --accent-3: #06b6d4;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --card-bg: rgba(18, 20, 32, 0.65);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    /* Theme Presets */
    body.theme-cosmic {
      --accent-1: #c084fc;
      --accent-2: #6366f1;
      --accent-3: #38bdf8;
      --accent-glow: rgba(99, 102, 241, 0.35);
    }
    body.theme-emerald {
      --accent-1: #34d399;
      --accent-2: #059669;
      --accent-3: #06b6d4;
      --accent-glow: rgba(16, 185, 129, 0.35);
    }
    body.theme-sunset {
      --accent-1: #fb7185;
      --accent-2: #f43f5e;
      --accent-3: #fbbf24;
      --accent-glow: rgba(244, 63, 94, 0.35);
    }
    body.theme-cyber {
      --accent-1: #00f0ff;
      --accent-2: #7000ff;
      --accent-3: #ff007b;
      --accent-glow: rgba(0, 240, 255, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      perspective: 1000px;
      transition: background-color 0.5s ease;
      position: relative;
    }

    /* Dynamic Canvas */
    #ambient-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Glowing ambient orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
      transition: all 1s ease;
      animation: float 14s infinite ease-in-out alternate;
    }
    .orb-1 {
      width: 480px;
      height: 480px;
      top: -100px;
      left: -100px;
      background: radial-gradient(circle, var(--accent-1), transparent 70%);
    }
    .orb-2 {
      width: 520px;
      height: 520px;
      bottom: -120px;
      right: -120px;
      background: radial-gradient(circle, var(--accent-2), transparent 70%);
      animation-delay: -5s;
    }
    .orb-3 {
      width: 380px;
      height: 380px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, var(--accent-3), transparent 70%);
      opacity: 0.25;
      animation-delay: -9s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, 30px) scale(1.08); }
      100% { transform: translate(-30px, 60px) scale(0.95); }
    }

    /* Interactive Spotlight follower */
    .spotlight {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 65%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 1;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    /* Container & Card */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 680px;
      padding: 24px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 48px 40px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      text-align: center;
      transition: transform 0.15s ease-out, box-shadow 0.3s ease;
      transform-style: preserve-3d;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        var(--accent-glow) 60deg,
        transparent 120deg
      );
      animation: rotateBorder 12s linear infinite;
      z-index: -1;
      opacity: 0.2;
    }

    @keyframes rotateBorder {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Top Badge */
    .badge-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #e2e8f0;
      margin-bottom: 24px;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #22c55e;
      box-shadow: 0 0 12px #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.6; }
    }

    /* Main Title */
    .title-container {
      margin-bottom: 16px;
      position: relative;
    }

    h1.title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.8rem, 7vw, 4.4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, #ffffff 10%, var(--accent-1) 50%, var(--accent-3) 90%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 6s linear infinite;
      transition: all 0.3s ease;
    }

    @keyframes shine {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    p.subtitle {
      font-size: 1.08rem;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 520px;
      margin: 0 auto 32px auto;
      font-weight: 400;
      min-height: 52px;
    }

    /* Language Switcher Pills */
    .lang-switcher {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 34px;
    }

    .lang-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }

    .lang-chip:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .lang-chip.active {
      background: linear-gradient(135deg, var(--accent-2), var(--accent-1));
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    /* Action Buttons */
    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 26px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      border: none;
      outline: none;
      user-select: none;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-2), var(--accent-1));
      color: white;
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 10px 28px var(--accent-glow);
      filter: brightness(1.1);
    }

    .btn-primary:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      color: #ffffff;
    }

    /* Theme Picker Bar */
    .footer-bar {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .live-clock {
      display: flex;
      align-items: center;
      gap: 6px;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    .theme-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-label {
      font-size: 0.8rem;
      margin-right: 4px;
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s, border-color 0.2s;
    }

    .dot:hover {
      transform: scale(1.2);
    }

    .dot.active {
      border-color: #ffffff;
      transform: scale(1.15);
    }

    .dot-cosmic { background: linear-gradient(135deg, #c084fc, #6366f1); }
    .dot-emerald { background: linear-gradient(135deg, #34d399, #059669); }
    .dot-sunset { background: linear-gradient(135deg, #fb7185, #fbbf24); }
    .dot-cyber { background: linear-gradient(135deg, #00f0ff, #ff007b); }

    /* Responsive */
    @media (max-width: 600px) {
      .card {
        padding: 36px 20px;
        border-radius: 22px;
      }
      .footer-bar {
        justify-content: center;
        flex-direction: column;
      }
    }
  </style>
</head>
<body class="theme-cosmic">
  <!-- Interactive Canvas Background -->
  <canvas id="ambient-canvas"></canvas>

  <!-- Glowing Mesh Orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Mouse Tracking Spotlight -->
  <div class="spotlight" id="spotlight"></div>

  <!-- Main Card -->
  <main class="container">
    <div class="card" id="card">
      <div class="badge-wrapper">
        <span class="pulse-dot"></span>
        <span>Online & Ready</span>
      </div>

      <div class="title-container">
        <h1 class="title" id="greeting-title">Hello, World!</h1>
      </div>

      <p class="subtitle" id="greeting-desc">
        Welcome to your modern HTML playground. Crafted with subtle glassmorphism, responsive physics, and ambient particle dynamics.
      </p>

      <!-- Language Selector -->
      <div class="lang-switcher">
        <button class="lang-chip active" data-lang="en" data-title="Hello, World!" data-sub="Welcome to your modern HTML playground. Crafted with subtle glassmorphism and ambient dynamics.">English</button>
        <button class="lang-chip" data-lang="es" data-title="¡Hola, Mundo!" data-sub="Bienvenido a tu moderno entorno web con efectos visuales y dinamismo envolvente.">Español</button>
        <button class="lang-chip" data-lang="fr" data-title="Bonjour, le Monde!" data-sub="Bienvenue sur votre terrain d'expérimentation moderne avec une touche d'élégance pure.">Français</button>
        <button class="lang-chip" data-lang="hi" data-title="नमस्ते, दुनिया!" data-sub="आधुनिक वेब डिज़ाइन और सुरुचिपूर्ण प्रभावों के साथ आपका हार्दिक स्वागत है।">हिन्दी</button>
        <button class="lang-chip" data-lang="ja" data-title="こんにちは、世界！" data-sub="純粋な美しさと最先端のウェブ技術で創り出された体験へようこそ。">日本語</button>
      </div>

      <!-- Action Buttons -->
      <div class="actions">
        <button class="btn btn-primary" id="burst-btn">
          <span>✨ Trigger Sparkles</span>
        </button>
        <button class="btn btn-secondary" id="randomize-btn">
          <span>🎲 Randomize Mood</span>
        </button>
      </div>

      <!-- Footer Bar -->
      <div class="footer-bar">
        <div class="live-clock">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span id="time-display">--:--:--</span>
        </div>

        <div class="theme-dots">
          <span class="theme-label">Atmosphere:</span>
          <span class="dot dot-cosmic active" data-theme="theme-cosmic" title="Cosmic Violet"></span>
          <span class="dot dot-emerald" data-theme="theme-emerald" title="Emerald Glow"></span>
          <span class="dot dot-sunset" data-theme="theme-sunset" title="Sunset Amber"></span>
          <span class="dot dot-cyber" data-theme="theme-cyber" title="Cyber Neon"></span>
        </div>
      </div>
    </div>
  </main>

  <script>
    // --- 1. Ambient Particle System ---
    const canvas = document.getElementById('ambient-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    let sparks = [];

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2 + 0.8;
        this.baseX = this.x;
        this.baseY = this.y;
        this.vx = (Math.random() - 0.5) * 0.45;
        this.vy = (Math.random() - 0.5) * 0.45;
        this.alpha = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0) this.x = width;
        if (this.x > width) this.x = 0;
        if (this.y < 0) this.y = height;
        if (this.y > height) this.y = 0;
      }
      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    class Spark {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color || '#fff';
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.friction = 0.94;
        this.gravity = 0.15;
        this.size = Math.random() * 3 + 1.5;
      }
      update() {
        this.vx *= this.friction;
        this.vy = this.vy * this.friction + this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.022;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(this.alpha, 0);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 70; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      // Connect near particles
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 110) {
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.12 * (1 - dist / 110)})`;
            ctx.lineWidth = 0.7;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      for (let i = sparks.length - 1; i >= 0; i--) {
        sparks[i].update();
        sparks[i].draw();
        if (sparks[i].alpha <= 0) {
          sparks.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }
    animate();

    function triggerSparkleShower(x, y) {
      const colors = ['#f43f5e', '#38bdf8', '#c084fc', '#34d399', '#fde047', '#ffffff'];
      for (let i = 0; i < 55; i++) {
        const c = colors[Math.floor(Math.random() * colors.length)];
        sparks.push(new Spark(x, y, c));
      }
    }

    // --- 2. Interactive Spotlight & Card 3D Tilt ---
    const spotlight = document.getElementById('spotlight');
    const card = document.getElementById('card');

    window.addEventListener('mousemove', (e) => {
      spotlight.style.opacity = '1';
      spotlight.style.left = e.clientX + 'px';
      spotlight.style.top = e.clientY + 'px';

      const rect = card.getBoundingClientRect();
      const cardCenterX = rect.left + rect.width / 2;
      const cardCenterY = rect.top + rect.height / 2;

      const deltaX = (e.clientX - cardCenterX) / (rect.width / 2);
      const deltaY = (e.clientY - cardCenterY) / (rect.height / 2);

      // Apply subtle 3D tilt if mouse is nearby
      const distance = Math.hypot(e.clientX - cardCenterX, e.clientY - cardCenterY);
      if (distance < 700) {
        const tiltX = -(deltaY * 7).toFixed(2);
        const tiltY = (deltaX * 7).toFixed(2);
        card.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
      } else {
        card.style.transform = 'rotateX(0deg) rotateY(0deg)';
      }
    });

    window.addEventListener('mouseleave', () => {
      spotlight.style.opacity = '0';
      card.style.transform = 'rotateX(0deg) rotateY(0deg)';
    });

    // --- 3. Language Switcher with Smooth Animation ---
    const langChips = document.querySelectorAll('.lang-chip');
    const titleEl = document.getElementById('greeting-title');
    const descEl = document.getElementById('greeting-desc');

    langChips.forEach(chip => {
      chip.addEventListener('click', (e) => {
        langChips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');

        // Smooth text morph
        titleEl.style.opacity = '0';
        titleEl.style.transform = 'translateY(-6px)';
        descEl.style.opacity = '0';

        setTimeout(() => {
          titleEl.textContent = chip.getAttribute('data-title');
          descEl.textContent = chip.getAttribute('data-sub');
          titleEl.style.opacity = '1';
          titleEl.style.transform = 'translateY(0)';
          descEl.style.opacity = '1';
        }, 180);

        const rect = chip.getBoundingClientRect();
        triggerSparkleShower(rect.left + rect.width / 2, rect.top + rect.height / 2);
      });
    });

    // --- 4. Interactive Burst & Randomize Buttons ---
    const burstBtn = document.getElementById('burst-btn');
    burstBtn.addEventListener('click', (e) => {
      const rect = burstBtn.getBoundingClientRect();
      triggerSparkleShower(rect.left + rect.width / 2, rect.top + rect.height / 2);
    });

    const themes = ['theme-cosmic', 'theme-emerald', 'theme-sunset', 'theme-cyber'];
    const themeDots = document.querySelectorAll('.dot');

    function setTheme(themeName) {
      document.body.className = themeName;
      themeDots.forEach(dot => {
        dot.classList.toggle('active', dot.getAttribute('data-theme') === themeName);
      });
    }

    themeDots.forEach(dot => {
      dot.addEventListener('click', () => {
        setTheme(dot.getAttribute('data-theme'));
      });
    });

    const randomBtn = document.getElementById('randomize-btn');
    randomBtn.addEventListener('click', () => {
      // Pick random theme
      const nextTheme = themes[Math.floor(Math.random() * themes.length)];
      setTheme(nextTheme);

      // Pick random greeting
      const randomChip = langChips[Math.floor(Math.random() * langChips.length)];
      randomChip.click();
    });

    // --- 5. Real-Time Digital Clock ---
    const timeDisplay = document.getElementById('time-display');
    function updateClock() {
      const now = new Date();
      timeDisplay.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
